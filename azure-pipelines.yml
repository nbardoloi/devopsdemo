# Azure DevOps Pipeline for SQL Database DACPAC Deployment
trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  # Connection string structure: Server=tcp:yourserver.database.windows.net,1433;Initial Catalog=yourdb;User ID=youruser;Password=yourpassword;
  # It is highly recommended to store this value securely in a secret variable or Azure Key Vault!
  - group: KeyVaultSecrets
  - name: azureSqlConnectionString
    value: '$(SqlConnectionStringSecret)'


stages:
- stage: Build


  displayName: 'Build DACPAC'
  jobs:
  - job: BuildJob
    displayName: 'Compile Database Project'
    steps:

    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet'

    - task: DotNetCoreCLI@2
      displayName: 'Restore SQL Project'
      inputs:
        command: 'restore'
        projects: '**/*.sqlproj'
        

    - task: DotNetCoreCLI@2
      displayName: 'Build SQL Project'
      inputs:
        command: 'build'
        projects: '**/*.sqlproj'
        arguments: '--configuration Release'

    - task: CopyFiles@2
      displayName: 'Copy DACPAC Artifact'
      inputs:
        SourceFolder: '$(agent.builddirectory)'
        Contents: '**/*.dacpac'
        TargetFolder: '$(build.artifactstagingdirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(build.artifactstagingdirectory)'
        ArtifactName: 'database-dacpac'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure SQL'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    displayName: 'Publish DACPAC to Azure'
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Download DACPAC Artifact'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'database-dacpac'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: PowerShell@2
      displayName: 'Debug: check variable length'
      inputs:
        targetType: 'inline'
        script: |
          $len = "$(azureSqlConnectionString)".Length
          Write-Host "Connection string length: $len"

    - task: SqlAzureDacpacDeployment@1
      displayName: 'Execute Azure SQL DACPAC Task'
      inputs:
        azureSubscription: 'Azure subscription 1(826d75e6-31fb-4b04-b9d6-50cfa34b5db2)'
        AuthenticationType: 'connectionString'
        ConnectionString: '$(azureSqlConnectionString)'
        deployType: 'DacpacTask'
        DeploymentAction: 'Publish'
        DacpacFile: '$(System.ArtifactsDirectory)/database-dacpac/**/*.dacpac'
        IpDetectionMethod: 'AutoDetect'